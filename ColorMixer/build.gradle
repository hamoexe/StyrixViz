plugins {
    id 'com.android.library'
}

android {
    namespace 'it.moondroid.colormixer'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // the library's AppTheme extends Theme.AppCompat.Light.DarkActionBar
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
