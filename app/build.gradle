plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hamo.styrixviz'
    compileSdk 36

    defaultConfig {
        applicationId "com.hamo.styrixviz"
        minSdk 21
        // Kept at 28 on purpose: the app still uses legacy storage and foreground-service behaviour.
        targetSdk 28

        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // libs/*.jar: annotations-12.0.jar, picasso-2.5.2.jar
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(':ColorMixer')

    // Prebuilt aars (kept in libs so they do not depend on a remote repository)
    implementation(name: 'ExoPlayer-library-release', ext: 'aar')
    implementation(name: 'recyclerviewfastscroller-release', ext: 'aar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
}
